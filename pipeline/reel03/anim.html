<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IK;src:url("file:///usr/share/fonts/opentype/inter/Inter-Black.otf")}
@font-face{font-family:IB;src:url("file:///usr/share/fonts/opentype/inter/Inter-Bold.otf")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id=c width=1080 height=1920></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const Y='#FFD60A',R='#FF3B30',G='#34C759',BG='#0B0B12';
// субтитры: [s,e,[[слово,s,e,hl]]]
const S=[
[0,1700,[["ПОКА",0,600],["ТЫ",0,700,"r"],["ЛИСТАЕШЬ",0,1200,"r"],["ЛЕНТУ",0,1700]]],
[1800,3500,[["КТО-ТО",1800,2200],["ПИШЕТ",2200,2600],["ОДНУ",2600,2900,"y"],["ФРАЗУ",2900,3500,"y"]]],
[3600,6000,[["ЧЕРЕЗ",3700,4000],["ПАРУ",4000,4200],["МИНУТ",4200,4600],["—",4600,4600],["ГОТОВОЕ",5000,5400],["ВИДЕО",5400,6000,"y"]]],
[6000,6700,[["БЕЗ",6000,6200],["КАМЕРЫ",6200,6700,"r"]]],
[6800,7600,[["БЕЗ",6800,7000],["МОНТАЖА",7000,7600,"r"]]],
[7600,8500,[["БЕЗ",7600,7800],["АКТЁРОВ",7800,8500,"r"]]],
[8500,11300,[["ПРОСТО",8500,8900],["ТЕКСТ",8900,9500,"y"],["→",9500,9600],["НЕЙРОСЕТЬ",9700,10200],["СНИМАЕТ",10200,10600],["САМА",10600,11000,"y"]]],
[11600,13500,[["РАЗНИЦА",11600,12000],["—",12500,12500],["НЕ",12700,12800,"r"],["ТАЛАНТ",12800,13500,"r"]]],
[13500,15100,[["А",13500,13600],["ТО,",13600,13800],["ЧТО",13800,14000],["ОН",14000,14100],["УЖЕ",14100,14300,"g"],["ПОПРОБОВАЛ",14300,15000,"g"]]],
[15300,18600,[["ССЫЛКА",15300,15700,"y"],["В",15700,15700,"y"],["ПРОФИЛЕ",15700,16400,"y"],["—",16400,16400],["ПОПРОБУЙ",16400,16800],["САМ",16800,17200]]],
];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), E=t=>1-Math.pow(1-cl(t),3), EB=t=>{t=cl(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
function rr(X,Yy,w,h,r){x.beginPath();x.roundRect(X,Yy,w,h,r);}
function txt(s,X,Yy,sz,col,al='center',f='IK'){x.font=`${sz}px ${f}`;x.textAlign=al;x.textBaseline='middle';x.fillStyle=col;x.fillText(s,X,Yy);}
function phone(cx,cy,w,h,col,glow){x.save();x.shadowColor=glow;x.shadowBlur=60;rr(cx-w/2,cy-h/2,w,h,48);x.fillStyle='#15151f';x.fill();x.restore();
 x.lineWidth=6;x.strokeStyle=col;rr(cx-w/2,cy-h/2,w,h,48);x.stroke();}
function feed(cx,cy,w,h,t,dim){ // бесконечная лента
 x.save();rr(cx-w/2+14,cy-h/2+14,w-28,h-28,36);x.clip();
 const off=(t*900)%260;
 for(let i=-1;i<6;i++){const yy=cy-h/2+30+i*260-off;x.fillStyle=`rgba(255,255,255,${.10*dim})`;rr(cx-w/2+40,yy,w-80,170,22);x.fill();
  x.fillStyle=`rgba(255,255,255,${.18*dim})`;rr(cx-w/2+40,yy+185,(w-80)*(.4+.3*((i*7+3)%5)/5),20,10);x.fill();}
 x.restore();}
function scene(cx,cy,w,h,t){ // «сгенерированное видео»: закат, кот-силуэт на скейте (стилизация)
 x.save();rr(cx-w/2+14,cy-h/2+14,w-28,h-28,36);x.clip();
 const g=x.createLinearGradient(0,cy-h/2,0,cy+h/2);g.addColorStop(0,'#2b1055');g.addColorStop(.55,'#ff6b35');g.addColorStop(.56,'#3a1c4a');g.addColorStop(1,'#120818');x.fillStyle=g;x.fillRect(cx-w/2,cy-h/2,w,h);
 x.fillStyle='#ffd27a';x.beginPath();x.arc(cx,cy+h*.05,w*.22,Math.PI,0);x.fill();
 for(let i=0;i<8;i++){const yy=cy+h*.08+i*i*9;x.fillStyle='rgba(255,180,90,.35)';x.fillRect(cx-w/2,yy,w,3);}
 const px=cx-w*.6+((t*260)%(w*1.2)), py=cy+h*.2;
 x.fillStyle='#0b0612';rr(px-70,py+40,140,14,7);x.fill();x.beginPath();x.arc(px-45,py+62,10,0,7);x.arc(px+45,py+62,10,0,7);x.fill();
 x.beginPath();x.ellipse(px,py,55,38,0,0,7);x.fill();x.beginPath();x.arc(px+48,py-38,30,0,7);x.fill();
 x.beginPath();x.moveTo(px+28,py-58);x.lineTo(px+36,py-88);x.lineTo(px+50,py-64);x.moveTo(px+52,py-64);x.lineTo(px+70,py-86);x.lineTo(px+74,py-56);x.fill();
 x.lineWidth=10;x.strokeStyle='#0b0612';x.beginPath();x.moveTo(px-50,py-10);x.quadraticCurveTo(px-100,py-60,px-80,py-90);x.stroke();
 x.restore();}
function label(s,cx,cy,col){x.font='64px IK';const w=x.measureText(s).width+60;rr(cx-w/2,cy-48,w,96,48);x.fillStyle=col;x.fill();txt(s,cx,cy+3,64,'#000');}
function cross(cx,cy,r,p,col){x.lineWidth=18;x.lineCap='round';x.strokeStyle=col;x.beginPath();const a=cl(p*2),b=cl(p*2-1);
 x.moveTo(cx-r,cy-r);x.lineTo(cx-r+2*r*a,cy-r+2*r*a);if(b>0){x.moveTo(cx+r,cy-r);x.lineTo(cx+r-2*r*b,cy-r+2*r*b);}x.stroke();}
function icon(k,cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#fff';x.strokeStyle='#fff';x.lineWidth=14;x.lineJoin='round';
 if(k==0){rr(-120,-70,170,140,24);x.fill();x.beginPath();x.moveTo(60,-20);x.lineTo(130,-60);x.lineTo(130,60);x.lineTo(60,20);x.fill();}
 if(k==1){x.beginPath();x.arc(-55,50,34,0,7);x.arc(55,50,34,0,7);x.stroke();x.beginPath();x.moveTo(-35,25);x.lineTo(60,-100);x.moveTo(35,25);x.lineTo(-60,-100);x.stroke();}
 if(k==2){x.beginPath();x.arc(0,-55,50,0,7);x.fill();x.beginPath();x.moveTo(-100,110);x.quadraticCurveTo(0,-30,100,110);x.fill();}
 x.restore();}
function subs(ms){const g=S.find(g=>ms>=g[0]-60&&ms<g[1]+150);if(!g)return;
 const words=g[2];x.font='104px IK';const sp=26;let lines=[[]],lw=[0];
 for(const w of words){const ww=x.measureText(w[0]).width;if(lw[lw.length-1]+ww>940&&lines[lines.length-1].length){lines.push([]);lw.push(0);}lines[lines.length-1].push([w,ww]);lw[lw.length-1]+=ww+sp;}
 const base=1530-(lines.length-1)*62, k=EB((ms-g[0]+60)/180);
 lines.forEach((ln,li)=>{let X=540-(lw[li]-sp)/2;for(const [w,ww] of ln){const on=ms>=w[1]-40, sc=on?1:.92;
  const col=!on?'rgba(255,255,255,.55)':w[3]=='y'?Y:w[3]=='r'?R:w[3]=='g'?G:'#fff';
  x.save();x.translate(X+ww/2,base+li*124);x.scale(sc*(.85+.15*k),sc*(.85+.15*k));x.lineWidth=16;x.lineJoin='round';x.strokeStyle='#000';x.font='104px IK';x.textAlign='center';x.textBaseline='middle';x.strokeText(w[0],0,0);x.fillStyle=col;x.fillText(w[0],0,0);x.restore();X+=ww+sp;}});}
function bgFx(t){x.fillStyle=BG;x.fillRect(0,0,W,H);const g=x.createRadialGradient(540,700,50,540,700,1100);g.addColorStop(0,'rgba(80,60,160,.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<40;i++){const px=(i*277)%W,py=(i*613+t*40*(1+i%3))%H;x.fillStyle='rgba(255,255,255,.06)';x.fillRect(px,H-py,4,4);}}
const PROMPT='рыжий кот на скейте, закат, камера следом';
function split(t,ms){ // сцена 1-2: ты vs он
 const pw=440,ph=900,cy=760;
 const shake=ms<300?(Math.sin(t*90)*14*(1-ms/300)):0;
 x.save();x.translate(shake,0);
 phone(280,cy,pw,ph,'#555','rgba(255,59,48,.35)');feed(280,cy,pw,ph,t,ms>11500?.5:1);
 phone(800,cy,pw,ph,Y,'rgba(255,214,10,.5)');
 if(ms<3600){ // набор промпта
  x.save();rr(800-pw/2+14,cy-ph/2+14,pw-28,ph-28,36);x.clip();x.fillStyle='#1d1d2b';x.fillRect(560,300,480,900);x.restore();
  const n=Math.floor(cl((ms-1800)/1700)*PROMPT.length);const shown=PROMPT.slice(0,Math.max(0,n));
  rr(800-180,cy-120,360,240,24);x.fillStyle='#262638';x.fill();
  x.font='34px IB';x.fillStyle='#fff';x.textAlign='left';x.textBaseline='top';
  const ws=shown.split(' ');let line='',ly=cy-95;for(const w of ws){if(x.measureText(line+w).width>310){x.fillText(line,800-160,ly);line='';ly+=44;}line+=w+' ';}
  x.fillText(line+((Math.floor(t*3)%2)?'|':''),800-160,ly);
  rr(800-110,cy+160,220,80,40);x.fillStyle=ms>3300?Y:'#444';x.fill();txt('СОЗДАТЬ',800,cy+202,34,'#000');
 } else if(ms<5400){ // генерация
  x.save();rr(800-pw/2+14,cy-ph/2+14,pw-28,ph-28,36);x.clip();x.fillStyle='#1d1d2b';x.fillRect(560,300,480,900);x.restore();
  const p=cl((ms-3600)/1700);x.lineWidth=16;x.strokeStyle='#333';x.beginPath();x.arc(800,cy,110,0,7);x.stroke();
  x.strokeStyle=Y;x.beginPath();x.arc(800,cy,110,-Math.PI/2,-Math.PI/2+p*Math.PI*2);x.stroke();txt(Math.round(p*100)+'%',800,cy,60,'#fff');
  txt('нейросеть снимает…',800,cy+190,30,'#aaa','center','IB');
 } else {scene(800,cy,pw,ph,t);if(ms<6200){const f=1-cl((ms-5400)/400);x.fillStyle=`rgba(255,255,255,${f*.9})`;x.fillRect(580,310,440,900);}
  rr(800-80,cy+ph/2-110,160,56,28);x.fillStyle='rgba(0,0,0,.55)';x.fill();txt('▶ ГОТОВО',800,cy+ph/2-82,30,G,'center','IB');}
 label('ТЫ',280,cy-ph/2-80,ms>11500?'#777':R);label('ОН',800,cy-ph/2-80,Y);
 x.restore();
 if(ms>11600){const p=E((ms-12700)/400);if(ms>12700){x.save();x.globalAlpha=cl((15100-ms)/300);rr(100,700,360,120,30);x.fillStyle='rgba(0,0,0,.7)';x.fill();txt('ТАЛАНТ?',280,762,64,'#fff');cross(280,760,80,p,R);x.restore();}
  if(ms>14100){const k=EB((ms-14100)/300);x.save();x.translate(800,cy-ph/2+80);x.scale(k,k);x.beginPath();x.arc(0,0,60,0,7);x.fillStyle=G;x.fill();x.lineWidth=14;x.strokeStyle='#000';x.beginPath();x.moveTo(-26,2);x.lineTo(-6,22);x.lineTo(28,-20);x.stroke();x.restore();}}
}
function noTools(t,ms){ // без камеры/монтажа/актёров
 const items=[[6000,0],[6800,1],[7600,2]];
 items.forEach(([s,k],i)=>{if(ms<s)return;const cy=430+i*330,k2=EB((ms-s)/250);icon(k,540,cy,k2*1.1);cross(540,cy,150,(ms-s-150)/300,R);});
}
function textToVideo(t,ms){ const p=E((ms-8500)/500);
 rr(140,420,800,180,30);x.fillStyle='#262638';x.fill();x.font='44px IB';x.fillStyle='#fff';x.textAlign='center';x.fillText('«'+PROMPT+'»',540,510,760);
 txt('↓',540,700+Math.sin(t*8)*12,120,Y);
 if(ms>9700){x.save();x.globalAlpha=E((ms-9700)/300);scene(540,1000,620,420,t);x.lineWidth=6;x.strokeStyle=Y;rr(540-310,1000-210,620,420,48);x.stroke();x.restore();}
 x.globalAlpha=1;}
function cta(t,ms){ const k=EB((ms-15300)/400);
 x.save();x.translate(540,640);x.scale(k,k);
 x.beginPath();x.arc(0,0,150,0,7);const g=x.createLinearGradient(-150,-150,150,150);g.addColorStop(0,'#f58529');g.addColorStop(.5,'#dd2a7b');g.addColorStop(1,'#8134af');x.lineWidth=14;x.strokeStyle=g;x.stroke();
 x.beginPath();x.arc(0,0,128,0,7);x.fillStyle='#1d1d2b';x.fill();txt('AI',0,6,96,Y);x.restore();
 txt('@889.amrr',540,880,64,'#fff');
 if(ms>15700){const k2=E((ms-15700)/300);rr(540-330,980,660,130,65);x.fillStyle=Y;x.globalAlpha=k2;x.fill();txt('ССЫЛКА В ПРОФИЛЕ ↑',540,1047,48,'#000');x.globalAlpha=1;}
 txt('↑',540,380+Math.sin(t*9)*18,110,Y);
}
function render(t){const ms=t*1000;bgFx(t);
 if(ms<6000||(ms>=11300&&ms<15300))split(t,ms);
 else if(ms<8500)noTools(t,ms);
 else if(ms<11300)textToVideo(t,ms);
 else cta(t,ms);
 // склейка: последние 0.5 с — вспышка к первому кадру
 if(ms>18100){x.fillStyle=`rgba(0,0,0,${cl((ms-18100)/400)*.8})`;x.fillRect(0,0,W,H);}
 // переходы-вспышки
 for(const s of [6000,8500,11300,15300]){const d=Math.abs(ms-s);if(d<120){x.fillStyle=`rgba(255,255,255,${(1-d/120)*.5})`;x.fillRect(0,0,W,H);}}
 subs(ms);}
window.ready=document.fonts.load('104px IK').then(()=>document.fonts.load('34px IB')).then(()=>{render(0);return true});
</script></body></html>
